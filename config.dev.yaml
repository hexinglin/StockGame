app:
  name: StockGame
  debug: true
  host: 0.0.0.0
  port: 16000
  log_level: INFO

database:
  type: postgresql
  path: "postgresql://autotrade:autotrade_pg_dev_2026@host.docker.internal:30004/stockgame"

