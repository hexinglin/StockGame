# StockGame 开发环境配置（与 config.yaml 相同，容器内改用 host.docker.internal）
app:
  name: StockGame
  debug: true
  host: 0.0.0.0
  port: 16000
  log_level: INFO

database:
  type: postgresql
  path: "postgresql://autotrade:autotrade_pg_dev_2026@host.docker.internal:30004/stockgame"

redis:
  host: "host.docker.internal"
  port: 30003
  db: 5
  password: "autotrade_redis_dev_2026"
  enabled: true

data_source:
  autotrade_dsn: "postgresql://autotrade:autotrade_pg_dev_2026@host.docker.internal:30004/autotrade"

heartbeat:
  interval_sec: 60
  timeout_sec: 180
  check_interval_sec: 15
  alert_cooldown_sec: 1800

feishu:
  webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/f91e7e9b-05f8-44a3-8b02-3ffd8c488f3a"
  # dev 环境开启飞书通知（QMT 离线/恢复告警）
  enabled: true

game:
  stock_code: "588000.SH"
  base_shares: 500000
  initial_cash: 500000
  fee_rate: 0.0001
  tick_sec: 3
  # 网格表默认参数（可在配置页覆盖，写 Redis 优先于此处）
  grid:
    grid_spacing: 0.005     # 网格间隔（绝对价格）
    init_value: 0.003       # 买点线初始值（x=0 时买点价）
    offset: 0.001           # off 值（卖点线偏移）
    interval: 2             # 间隔（下拉 1/2/4/6）：买卖格号偏移 = interval - 1
    grid_up: 8              # 锚点上方网格行数
    grid_down: 8            # 锚点下方网格行数
    hit_tolerance: 0.001    # 成交触发命中容差（绝对价格 ±）
